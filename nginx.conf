##############################################################################
#  nginx.conf — Production config for Leave Management Dashboard (SPA)
#
#  Responsibilities:
#   1. Serve the compiled Vite bundle from /usr/share/nginx/html
#   2. Handle client-side routing (React Router) via the SPA fallback
#   3. Apply gzip compression to reduce payload sizes
#   4. Set long-lived cache headers on hashed static assets
##############################################################################

server {
    listen 80;
    server_name _;                    # Accepts any hostname / IP

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    # Gzip reduces text file sizes by 60-80%, speeding up first load.
    gzip            on;
    gzip_vary       on;               # Add Vary: Accept-Encoding header
    gzip_min_length 1024;             # Don't compress tiny files (<1KB)
    gzip_proxied    expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    # Basic hardening — extend these as needed for production.
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite adds a content hash to every JS/CSS filename (e.g., index-Bx3mN9.js)
    # so it is completely safe to cache these for 1 year.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;               # Don't log every static asset hit
    }

    # ── SPA fallback (React Router) ───────────────────────────────────────────
    # This is the MOST IMPORTANT rule for a React SPA.
    # Without it, refreshing any route other than "/" returns a 404.
    #
    # How it works:
    #   1. Try to serve the file exactly as requested ($uri)
    #   2. Try to serve it as a directory ($uri/)
    #   3. Fall back to /index.html — React Router takes over from here
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Healthcheck endpoint ──────────────────────────────────────────────────
    # Used by load balancers / container orchestrators (e.g., Kubernetes probes)
    # to confirm the container is alive without hitting real app logic.
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
